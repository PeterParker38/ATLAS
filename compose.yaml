name: atlas
services:
  node:
    build: .
    image: atlas:week1
    init: true
    ports:
      - "127.0.0.1:${ATLAS_PORT:-7070}:7070"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 10s
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    # Intentionally no data volume: this week-1 adapter has NO persistence.
